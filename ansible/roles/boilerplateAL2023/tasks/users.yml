---
# Add xdeploy user and their necessary keys/settings

- name: Adding xdeploy user
  become: true
  user:
    name: xdeploy
    shell: /bin/bash

- name: Adding SSH authorized keys entry for xdeploy user on coast dev jump hosts
  become: true
  authorized_key:
    user: xdeploy
    key: "{{ lookup('file', '../files/users/id_rsa_coast_dev.pub') }}"
  #when: not prod

- name: Adding SSH authorized keys entry for xdeploy user on coast prod jump hosts
  become: true
  authorized_key:
    user: xdeploy
    key: "{{ lookup('file', '../files/users/id_rsa_coast_prod.pub') }}"
  #when: prod

- name: Allowing password-less sudo access to xdeploy
  become: true
  lineinfile:
    path: /etc/sudoers
    regexp: "xdeploy ALL"
    line: "xdeploy ALL=(ALL) NOPASSWD: ALL"
    state: present

# Note: This is intended to be used with passwordless SSH key access. If this is a policy violation, then the process needs to be adjusted.
- name: Disable password rotation for xdeploy
  become: true
  shell:
    cmd: chage -M -1 xdeploy

# Note: This is only due to certain applications needing to run as root. This may be a policy violation.
- name: Disable password rotation for root
  become: true
  shell:
    cmd: chage -M -1 root