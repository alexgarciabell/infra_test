- name: Setting net.core.somaxconn
  become: true
  sysctl:
    name: net.core.somaxconn
    value: 65535
    state: present

- name: Setting net.ipv4.tcp_max_syn_backlog
  become: true
  sysctl:
    name: net.ipv4.tcp_max_syn_backlog
    value: 4096
    state: present

- name: Setting net.ipv4.tcp_max_tw_buckets
  become: true
  sysctl:
    name: net.ipv4.tcp_max_tw_buckets
    value: 262144
    state: present

- name: Setting net.ipv4.tcp_mem
  become: true
  sysctl:
    name: net.ipv4.tcp_mem
    value: "947616    1263488    1895232"
    state: present

- name: Setting net.ipv4.tcp_max_orphans
  become: true
  sysctl:
    name: net.ipv4.tcp_max_orphans
    value: 262144
    state: present

- name: Modify soft nofile limits for wildcard domain
  become: true
  pam_limits:
    domain: '*'
    limit_type: soft
    limit_item: nofile
    value: 120000

- name: Modify hard nofile limits for wildcard domain
  become: true
  pam_limits:
    domain: '*'
    limit_type: hard
    limit_item: nofile
    value: 120000

- name: Modify soft nproc limits for wildcard domain
  become: true
  pam_limits:
    domain: '*'
    limit_type: soft
    limit_item: nproc
    value: 8192

- name: Modify hard nproc limits for wildcard domain
  become: true
  pam_limits:
    domain: '*'
    limit_type: hard
    limit_item: nproc
    value: 8192