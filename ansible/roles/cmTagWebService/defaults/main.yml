---
# defaults file for cmTagWebService
run_number: a
local_dir: /opt/storage/deploy/appsDS
service_install_dir: "/opt/xcal/apps/{{ service_name }}"
properties_dir: "{{ service_install_dir }}"
env_type: ci
datacenter: ae
environment_name: "{{ env_type }}-{{ datacenter }}"
branch: "{{ deploy_branch }}"
artifact_repo:  https://artifactory.comcast.com/artifactory/x1IcsCoreServices-libs-releases/
dest_artifact: "{{ service_name | default('ROOT') }}.war"
owner_user: xdeploy
sleep_time: 0
service_listen_port: 10869
service_jmx_port: 10870
service_stop_port: 10871
heapMin: 2048m
heapMax: 2048m
heapMaxPermSize: 192m
heapNewSize: 512m
heapMaxNewSize: 512m
extra_jvm_args: ""
service_name: cmTagWebService
artifact_group_id: com.comcast.apps.community-manager
artifact_id: cm-tag-webservice
artifact_version: 1.2.8
service_listen_port_ssl: 9482
java_home: /usr/java/latest
use_vault: false
jetty_install_dir: "/opt/xcal/apps/"
jetty_version: 9.4.7.v20170914
vector_systemd_memory_max: 512000000
vector_systemd_cpu_quota: 20%
# properties file.
acl_auth_url: https://ci.aclauthservice.ccp.xcal.tv/aclAuthService/
acl_service_name: taggingService
acl_session_time: 10
data_service_end_point: https://ci.cmtagds.coast.xcal.tv:9481/cmTagDataService
data_service_user_agent: Tagging_Service_Portal_CI
sat_request_url: https://sat-prod.codebig2.net/v2/oauth/token
requester_user_agent: Tagging_Service_Portal_CI