    priority: 1
  with_items:
    - { name: "endpointsec-crowdstrike", baseurl: "https://yumrepo.sys.comcast.net/endpointsecurity/crowdstrike/amazon/2023/x86_64/", desc: "Crowdstrike (Amazon Linux 2023 - x64)" }
  become: yes
  become_user: root
  notify: yum-clean-metadata

