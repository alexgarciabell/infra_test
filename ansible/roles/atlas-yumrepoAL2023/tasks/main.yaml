# Install Atlas Yum Repositories

- name: "Include Atlas Repo - FAR (AMZN Linux 2)"
  yum_repository:
    name: "{{ item.name }}"
    description: "{{ item.desc }}"
    baseurl: "{{ item.baseurl }}"
    gpgcheck: no
    enabled: yes
    proxy: _none_
    priority: 1
  with_items:
    - { name: "appds-prod", baseurl: "https://yumrepo.sys.comcast.net/appds_repo/far/amznlnx2", desc: "Apps Data Services (FAR) Production Packages for $releasever $basearch" }
  become: yes
  become_user: root
  notify: yum-clean-metadata

- name: "Include Atlas Repo - Crowdstrike (AMZN Linux 2023)"
  yum_repository:
    name: "{{ item.name }}"
    description: "{{ item.desc }}"
    baseurl: "{{ item.baseurl }}"
    gpgcheck: no
    enabled: yes
