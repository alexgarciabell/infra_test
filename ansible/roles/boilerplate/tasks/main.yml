---
# this task moved from ansible-prerequisites, because these are not prerequisites for ansible,
# rather nice to have utils for hosts in AWS
- name: Former ansible-prerequisites
  become: true
  pip:
    name: "{{ item }}"
    executable: pip
    state: present
  loop:
    - awscli==1.16.300
    - route53==1.0.1
    - boto==2.49.0
    - boto3==1.14.48


# tasks file for boilerplate
- name: Installing basic apps
  become: true
  yum:
    name: "{{ item }}"
    state: present
  loop:
    - nc
    - ntp
    - vi
    - nano
    - git
    - tcpdump
    - wget
    - curl
    - traceroute

- name: Remove pre-installed apps
  become: true
  yum:
    name: "{{ item }}"
    state: removed
  loop:
    - telnet

- name: Updating all packages to latest
  become: true
  yum:
    name: "*"
    state: latest
    exclude:
      - python-urllib3
    disable_gpg_check: true
    #security: true

# AWS: this and related NTP tasks are useless in AWS, because Amazon Linux 2 always configured to use
# pool 2.amazon.pool.ntp.org iburst, which provides 0-1 ms synchronisation "within" time
# and ignores server(s) in /etc/ntp.conf
- name: copy ntp config file
  template:
    src: ntp_conf.j2
    dest: "/etc/ntp.conf"
    mode: 0644
    owner: "root"
    group: "root"
  become: true
  notify:
  - Restart ntp
  - Enable ntp demon

- name: set time zone to utc
  copy:
    src: "/usr/share/zoneinfo/UCT"
    dest: "/etc/localtime"
    mode: 0644
    owner: "root"
    group: "root"
  become: true
  notify:
  - Restart ntp
  - Enable ntp demon

- name: report the synchronisation state of the NTP daemon
  shell: ntpstat

- name: Placing SSH login banner
  become: true
  copy:
    src: ../files/security/sshd_banner.txt
    dest: /etc/ssh/sshd_banner.txt
  notify: Restart SSH

- name: Enabling SSH login banner
  become: true
  lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "^#?Banner"
    line: "Banner /etc/ssh/sshd_banner.txt"
  notify: Restart SSH

- name: Configuring User(s)
  import_tasks: users.yml

- name: Applying kernel changes
  import_tasks: kernel.yml

- name: Apply logrotate configurations
  import_tasks: logrotate_setup.yml

#This will be used to store various scripts meant to be run on the host, including the image base host
- name: Create script directory
  file:
    path: "/opt/xcal/apps/local_scripts"
    owner: "root"
    group: "root"
    state: directory
    mode: 0755
  become: true