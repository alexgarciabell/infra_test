---
# defaults file for Blueocean
run_number: a
local_dir: /opt/storage/deploy/appsDS
service_install_dir: "/opt/xcal/apps/{{ service_name }}"
properties_dir: "{{ service_install_dir }}"
env_type: ci
datacenter: ae
environment_name: "{{ env_type }}-{{ datacenter }}"
branch: "{{ deploy_branch }}"
artifact_repo: https://artifactory.comcast.com/artifactory/x1IcsCoreServices-libs-releases/
dest_artifact: "{{ service_name | default('ROOT') }}.war"
owner_user: xdeploy
sleep_time: 0
service_listen_port: 10991
service_jmx_port: 10992
service_stop_port: 10993
heapMin: 2048m
heapMax: 2048m
heapMaxPermSize: 192m
heapNewSize: 512m
heapMaxNewSize: 512m
extra_jvm_args: ""
service_name: blueocean
artifact_group_id: com.comcast.coast.blueocean
artifact_id: blueocean-service
artifact_version: 1.7.4
service_listen_port_ssl: 443
java_home: /usr/java/latest
use_vault: true
jetty_install_dir: "/opt/xcal/apps/"
jetty_version: 9.4.18.v20190429
vector_systemd_memory_max: 1024000000
vector_systemd_cpu_quota: 20%
#From userdata files - based on Ohio CI in BO AWS
dataQueueUrl: https://sqs.us-east-1.amazonaws.com/788354415550/blueocean-sqs-ae-ci-2025-v1
cassandraSeeds: tvxscy-va-blo-test-d10001.iap.r53.xcal.tv,tvxscy-va-blo-test-d10002.iap.r53.xcal.tv,tvxscy-va-blo-test-d10003.iap.r53.xcal.tv
dbDatacenter: AE
altCassandraSeeds: tvxscy-va-blo-test-d10001.iap.r53.xcal.tv,tvxscy-va-blo-test-d10002.iap.r53.xcal.tv,tvxscy-va-blo-test-d10003.iap.r53.xcal.tv
altDBDatacenter: AE
migrationPhase: 0
keystore_1_path: /opt/xcal/apps/blueocean/keystore/keystore.jks
truststore_1_path: /opt/xcal/apps/blueocean/keystore/truststore.jks
keystore_2_path: /opt/xcal/apps/blueocean/keystore/c5x_keystore.jks
truststore_2_path: /opt/xcal/apps/blueocean/keystore/c5x_truststore.jks