- name: Replace vector.service system file for systemd
  template: src=vector.service.j2 dest=/etc/systemd/system/vector.service mode=0755
  become: true

- name: registring toml files stats
  stat:
    path: /etc/vector/source.toml
  register: toml_file

- name: Cloning a observability-clients/capitalservices Git repo
  git:
    repo: 'https://{{ ghe_access_token }}@github.com/comcast-xvp-cs/observability_capitalservices.git'
    dest: /tmp/vector
    clone: yes
    update: yes
  when: toml_file.stat.exists== False
  no_log: true

- name: copying the toml files
  shell: sudo cp /tmp/vector/vector/epsadmin/*.toml ./roles/epsAdminService/templates/
  when: toml_file.stat.exists== False

- name: Recursively change ownership of a directory
  ansible.builtin.file:
    path: ./roles/epsAdminService/templates/
    state: directory
    mode: 0755
    recurse: yes
  become: true

- name: copying toml files from templates to etc/vector
  template:
    src: "{{ item.src }}"
    dest: /etc/vector/
  loop:
    - { src: '../templates/source.toml' }
    - { src: '../templates/global.toml' }
    - { src: '../templates/internal.toml' }
    - { src: '../templates/sink.toml' }
    - { src: '../templates/transforms.toml' }
  when: toml_file.stat.exists== False
  become: true

- name: Deleting cloned repo content & directory
  file:
    state: absent
    path: /tmp/vector
  when: toml_file.stat.exists== False

- name: Removing Vector.toml file
  file:
    path: /etc/vector/vector.toml
    state: absent
  become: true

- name: restart vector
  command: systemctl restart vector
  become: true

- name: Ensure vector is running and enabled
  service: name=vector state=started enabled=yes
  become: true
  tags: Install_Vector