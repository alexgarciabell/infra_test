---
- hosts: all
  roles:
    - { role: java, when: run_number == "a" }
    - { role: jetty, when: run_number == "a" }
    - customSplitEvaluator
    - eracent-installer

  vars:
    java_package: "java-1.8.0-amazon-corretto-devel"
    jetty_version: "9.4.17.v20190418"
    swidtag_file: "Custom_Split_Evaluator.swidtag"
